on-unmatched = "warn"
allow-missing-formatter = true

# separate from `.gitignore`
excludes = [
  ".editorconfig",
  ".envrc",
  ".gitignore",
  "*.lock",

  ".direnv/**",
  "node_modules/**",
  # images
  "*.{avif,png,svg,jpg,jpeg,webp}",
  # build output
  "public/**",
]

[formatter.nixfmt]
  command = "nixfmt"
  options = [  ]
  includes = [ "*.nix" ]

[formatter.prettier]
  command = "prettier"
  options = [ "--write" ]
  includes = [
    "*.html",
    "*.css",
    "*.scss",
    "*.js",
    "*.jsx",
    "*.ts",
    "*.tsx",
    "*.json",
    "*.yaml",
    "*.yml",
    "*.md",
    "*.mdx",
  ]

[formatter.taplo]
  command = "taplo"
  options = [ "format" ]
  includes = [ "*.toml" ]
