tintle = "native.cloud"
baseURL = "https://native.cloud"

disableBrowserError = true
disableKinds = ["taxonomy"]
enableGitInfo = false
enableRobotsTXT = true
ignoreFiles = [ ]

# Language settings
defaultContentLanguage = "en-US"
defaultContentLanguageInSubdir = false
disableLanguages = [ ]

# Summary length in words (default is 70)
# Set high to avoid auto-truncation, but not so high it breaks <!-- more -->
summaryLength = 1000

# Mount ontology to the path that the site expects
[module]
  [[module.mounts]]
    source = "site/en-US"
    target = "content"
  [[module.mounts]]
    source = "ontology/en-US"
    target = "content/groups"

# Permalinks configuration to remove /groups/ prefix from section URLs
[permalinks]
  [permalinks.section]
    groups = '/:slug/'

timeZone = "UTC"

# Hugo-level timeout for static site generation
timeout = "120s"

[caches]
 [caches.assets]
  dir = ":resourceDir/_gen"
  maxAge = "86400s"
 [caches.getresource]
  dir = ":cacheDir/:project"
  maxAge = "86400s"
 [caches.images]
  dir = ":resourceDir/_gen"
  maxAge = "86400s"
 [caches.misc]
  dir = ":cacheDir/:project"
  maxAge = "180s"
 [caches.modulegitinfo]
  dir = ":cacheDir/modulegitinfo"
  maxAge = "120s"
 [caches.modulequeries]
  dir = ":cacheDir/modulequeries"
  maxAge = "120s"
 [caches.modules]
  dir = ":cacheDir/modules"
  maxAge = "86400s"

# Where to find the date for blog-style articles
[frontmatter]
date = ["date", "publishDate", ":filename"]

[languages]
[languages.en-US]
disabled = false
direction = "ltr"
title = "native.cloud"
label = "English"
weight = 0


[markup]
 [markup.goldmark]
   [markup.goldmark.extensions]
     definitionList = true
     strikethrough = true
     typographer = false
     [markup.goldmark.extensions.extras]
       [markup.goldmark.extensions.extras.superscript]
         enable = true
   [markup.goldmark.parser]
     autoHeadingID = true
     autoHeadingIDType = "blackfriday"
     [markup.goldmark.parser.attribute]
       block = true
   [markup.goldmark.renderer]
     unsafe = false


# Output formats
[outputs]
home = [ "HTML" ]
page = [ "HTML"]
section = [ "HTML" ]

# Site map and default priority
[sitemap]
  filename = "sitemap.xml"
  priority = 0.9

# Custom site parameters (exposed to templates via .Site.Params)
[params]
  # Accent color, passed into the CSS build (see layouts/_partials/css.html).
  # Text contrast is calculated automatically at build time unless accentContrastingColor is set.
  accentColor = "#fbb15b"
  # accentContrastingColor = "#424242"
  hyperlinkColorDarkPages = "#6b9fff"
  hyperlinkColorLightPages = "#044ea4"

  # Sidebar and navigation settings (inspired by docsy)
  github_repo = "https://github.com/controlplaneio/native-cloud"
  github_branch = "main"

  [params.ui]
    sidebar_resizable = false
    sidebar_menu_compact = false
    ul_show = 3
    sidebar_menu_foldable = true
    sidebar_cache_limit = 2000
    breadcrumb_disable = false
