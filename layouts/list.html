{{ define "main" }}
<div class="dual-sidebar-layout">
  {{ partial "sidebar-tree.html" . }}
  <div class="main-content-with-sidebars">
    {{ if .Content }}
    <section class="content">
         {{ partial "breadcrumbs.html" . }}
         {{- partial "page-content.html" (dict "context" . "content" .Content) -}}
    </section>
    {{ end }}

    <section class="content page-list">
        {{- partial "page-list.html" (dict "pages" .Pages) -}}
    </section>
  </div>
  {{ partial "sidebar-right.html" . }}
</div>
{{ end }}
