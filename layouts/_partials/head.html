<head>
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
{{- with .Description -}}
  <meta name="description" content="{{ . }}" />
{{- end -}}
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<!-- handles dark-mode inside the svg -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="native.cloud" />
<link rel="manifest" href="/site.webmanifest" />
<title>
  {{- if .IsHome -}}
    {{- .Site.Title }}
  {{- else -}}
    {{- T "page_title" (dict "title" .Title) }}
  {{- end -}}
</title>

<style>
  html { background: Canvas; color: CanvasText; }
</style>

{{ range .AlternativeOutputFormats -}}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .RelPermalink | safeURL }}">
{{ end -}}
</head>

{{- partialCached "css.html" . -}}
